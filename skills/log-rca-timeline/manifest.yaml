description: >
  把原始日志按时间窗口聚合成可比较的统计序列，用「中位数 + MAD」稳健基线配双阈做异常检测，
  识别十四类异常模式（流量突增、断崖断流、错误率飙升、致命错误突现、延迟抬升、P99 长尾恶化、
  新错误签名涌现、重试风暴、单服务集中、级联传播、阶跃漂移、日志静默、周期性毛刺、饱和度线索），
  再对十四条候选根因按形态覆盖度、证据分级、时序先后与集中度打分排序，每条附具体验证动作与可排除条件，
  最终产出含聚合序列图、异常模式摘要、根因假设排序与故障时间线的 HTML 交互看板。
  输入支持纯文本、JSONL、CSV 三类日志，自动识别 ISO8601、nginx、syslog、Android、Unix epoch 时间戳，
  自动抽取级别、耗时、服务名并做日志签名归一化以支撑去噪统计。
  输出定位为「根因假设排序」而非定论：所有结论均须与监控指标、调用链与变更记录交叉验证；
  未提供告警时刻时不臆测 MTTD，未提供变更记录时不给变更类假设加时序满分。
