# ongrid 最小栈 nginx —— 仅 SPA 静态资源 + /api 反向代理。
#
# 与正式 nginx.conf 的区别：正式配置还代理 prometheus / grafana / loki /
# tempo / profiles-gateway 五个 upstream，并强制 80 -> 443 跳转。最小栈里
# 这些服务都不存在，而 nginx 在加载配置时就要解析 upstream 主机名，
# 名字解析不到会直接导致 nginx 启动失败（host not found in upstream），
# 因此这里只保留 ongrid 一个 upstream，并去掉 TLS（无证书）。
#
# 仅用于本地冒烟验证；正式环境请用 deploy/nginx/nginx.conf。

events { worker_connections 1024; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    sendfile on;
    keepalive_timeout 65;

    gzip on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # WebSSH / SSE / WebSocket 需要的 Upgrade 头桥接
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      "";
    }

    # Docker 内嵌 DNS。配上 resolver + 用变量形式 proxy_pass，nginx 才会在
    # 运行时重新解析 ongrid，而不是只在启动时解析一次并缓存 IP —— 否则
    # 重建 ongrid 容器（换 IP）后 nginx 会一直 502，必须手动 restart web。
    resolver 127.0.0.11 valid=10s ipv6=off;

    # 数据面限流（与正式栈同名 zone，edge 推送日志/链路共用）
    limit_req_zone $http_authorization zone=edge_dataplane:16m rate=2000r/m;

    # ongrid / loki / tempo 都用变量形式代理：upstream 静态写法会在
    # nginx 启动时解析主机名，容器不存在直接起不来；变量写法把解析
    # 推迟到请求时，loki/tempo 短暂 absent 也只是该路径 502。
    upstream ongrid_backend {
        server ongrid:8080;
        keepalive 16;
    }

    server {
        listen 80;
        listen [::]:80;
        server_name _;

        # 后端 API。proxy_pass 不带 URI，保留原始路径（后端自身挂 /api 前缀）。
        # 用变量形式走上面的 resolver，使 upstream 主机名在运行时重新解析。
        set $ongrid_host "ongrid";
        set $loki_host   "loki";
        set $tempo_host  "tempo";

        location /api/ {
            proxy_pass http://$ongrid_host:8080;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade           $http_upgrade;
            proxy_set_header Connection        $connection_upgrade;
            proxy_connect_timeout 10s;
            proxy_send_timeout    60s;
            proxy_read_timeout    60s;
        }

        # 健康检查直通，方便宿主直接探活
        location /healthz {
            proxy_pass http://$ongrid_host:8080;
        }

        # ---- 遥测数据面：edge → Loki/Tempo 推送（照搬正式栈 ADR-012/013/014）----
        # edge 用边缘凭证推日志/链路，nginx auth_request 校验后直通后端，
        # 不经 manager Go。seed 值 loki:3100 / tempo:4318 是 docker 内部
        # 主机名，edge 不可达，manager 会在 PublicURL 非空时把推送端点
        # 改写成 <PublicURL>/loki/... 与 <PublicURL>/v1/traces（见
        # main.go pluginEndpointResolver）。
        location = /loki/api/v1/push {
            auth_request     /__auth_dataplane;
            auth_request_set $edge_id $upstream_http_x_edge_id;

            limit_req        zone=edge_dataplane burst=200 nodelay;
            client_max_body_size 16M;

            proxy_pass http://$loki_host:3100;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Edge-Id         $edge_id;
            proxy_set_header X-Scope-OrgID     ongrid;
            proxy_set_header Authorization     "";
            proxy_set_header Connection "";
            proxy_connect_timeout 10s;
            proxy_send_timeout    60s;
            proxy_read_timeout    60s;
        }

        # 统一 Edge Collector 的原生 OTLP/HTTP 日志端点（路径不同需重写）
        location = /loki/otlp/v1/logs {
            auth_request     /__auth_dataplane;
            auth_request_set $edge_id $upstream_http_x_edge_id;

            limit_req        zone=edge_dataplane burst=200 nodelay;
            client_max_body_size 16M;

            rewrite ^ /otlp/v1/logs break;
            proxy_pass http://$loki_host:3100;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Edge-Id         $edge_id;
            proxy_set_header X-Scope-OrgID     ongrid;
            proxy_set_header Authorization     "";
            proxy_set_header Connection "";
            proxy_connect_timeout 10s;
            proxy_send_timeout    60s;
            proxy_read_timeout    60s;
        }

        # 当前 edge 版本使用的标准 OTLP 路径（别名）
        location = /otlp/v1/logs {
            rewrite ^ /loki/otlp/v1/logs last;
        }

        # Tempo OTLP/HTTP 链路接收端（edge → /v1/traces）
        location = /v1/traces {
            auth_request     /__auth_dataplane;
            auth_request_set $edge_id $upstream_http_x_edge_id;

            limit_req        zone=edge_dataplane burst=200 nodelay;
            client_max_body_size 16M;

            proxy_pass http://$tempo_host:4318;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Edge-Id         $edge_id;
            proxy_set_header X-Scope-OrgID     ongrid;
            proxy_set_header Authorization     "";
            proxy_set_header Connection "";
            proxy_connect_timeout 10s;
            proxy_send_timeout    60s;
            proxy_read_timeout    60s;
        }

        # 数据面凭证校验（edge access/secret key），同正式栈。
        # 变量 proxy_pass 不允许带 URI，用 rewrite + break 转到校验端点。
        location = /__auth_dataplane {
            internal;
            rewrite ^ /internal/auth/dataplane-verify break;
            proxy_pass http://$ongrid_host:8080;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header Authorization     $http_authorization;
            proxy_set_header X-Original-URI    $request_uri;
        }

        # SPA 静态资源 + history 路由回退
        location / {
            root /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/ /index.html;
        }
    }
}
